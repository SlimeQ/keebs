name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET tools
        shell: pwsh
        run: dotnet tool restore

      - name: Restore projects
        shell: pwsh
        run: dotnet restore Keebs.slnx

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          [xml] $project = Get-Content Keebs/Keebs.csproj -Raw
          $projectVersion = [string] $project.Project.PropertyGroup.Version
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($tagVersion -ne $projectVersion) {
            throw "Release tag version '$tagVersion' does not match project version '$projectVersion'."
          }

      - name: Run tests
        shell: pwsh
        run: dotnet test Keebs.slnx --no-restore -c Release

      - name: Build installer
        shell: pwsh
        run: ./build-installer.ps1 -Configuration Release -Runtime win-x64

      - name: Create GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          "artifacts/installer/Keebs-Setup-win-x64.msi"
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
